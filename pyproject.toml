[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uspto-revisit"
version = "0.1.0"
description = "Reproducible LLM extraction and template-anomaly evaluation for USPTO reaction data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3,<4",
    "ChemSpiPy>=2,<3",
    "rdkit>=2022.3.4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "PyYAML>=6.0,<7",
    "pydantic>=2,<3",
    "nest_asyncio>=1.6,<2",
    "openai>=1,<3",
    "google-genai>=1,<3",
    "pandas>=2.2.3,<4",
    "requests>=2.34.2,<3",
    "tqdm>=4.66.4,<5",
]

[project.optional-dependencies]
mapping = [
    "localmapper[rdkit]==0.1.4",
    "torch>=2.13,<3",
    "dgl==2.2.1",
    "torchdata>=0.11,<1",
]
dev = [
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "pytest>=8,<10",
    "streamlit>=1.38,<2",
]

[project.scripts]
uspto-revisit = "uspto_revisit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
