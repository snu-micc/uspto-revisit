name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install evaluation and test dependencies
        # RDKit, pandas, numpy and SciPy fix the canonical SMILES, the scored
        # tables and the exact-test p-values, so they are pinned to the
        # versions in requirements-lock.txt.
        run: |
          grep -E '^(numpy|pandas|rdkit|scipy)==' requirements-lock.txt > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -c "$RUNNER_TEMP/constraints.txt" -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
